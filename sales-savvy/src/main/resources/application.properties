spring.application.name=sales-savvy

# Database credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sales_savvy_db}
spring.datasource.username=root
spring.datasource.password=Sindhu@1234

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# JWT: provide a strong secret through the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Keep security logs from exposing excessive request details.
logging.level.org.springframework.security=INFO

# Comma-separated deployed frontend origins (include localhost for development)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Password reset utility is disabled unless explicitly enabled.
app.demo-password-reset.enabled=false

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
